<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 오디오</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #111; color: #fff;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 72px 16px 40px; text-align: center;
  }
  .title { font-size: 26px; font-weight: 700; margin-bottom: 24px; word-break: keep-all; }
  .icon {
    width: 140px; height: 140px; border-radius: 50%; background: #ffcc00; color: #111;
    display: flex; align-items: center; justify-content: center; font-size: 56px;
    margin-bottom: 20px; cursor: pointer; user-select: none;
  }
  .icon:active { transform: scale(0.96); }
  .hint { color: #aaa; font-size: 15px; min-height: 22px; }
  audio { width: 100%; max-width: 400px; margin-top: 24px; }
  /* 프롬프트 상자 */
  .prompt {
    width: 100%; max-width: 400px; margin-top: 28px; padding: 16px;
    background: #1c1c1c; border: 1px solid #333; border-radius: 12px; text-align: left;
  }
  .prompt-label { font-size: 12px; font-weight: 700; color: #ffcc00; letter-spacing: 0.05em; margin-bottom: 8px; }
  .prompt-text { font-size: 15px; line-height: 1.6; color: #ddd; white-space: pre-wrap; word-break: break-word; }
  /* 자동재생이 막혔을 때: 화면 아무 데나 누르면 재생 */
  #tapLayer { position: fixed; inset: 0; display: none; cursor: pointer; }
  #backBtn {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    padding: 10px 16px; border-radius: 999px; background: #333; color: #fff;
    font-size: 16px; text-decoration: none;
  }
  ul { list-style: none; width: 100%; max-width: 400px; }
  li a {
    display: block; padding: 16px; margin: 8px 0; background: #222; border-radius: 12px;
    color: #fff; text-decoration: none; font-size: 17px;
  }
</style>
</head>
<body>

<div id="main"></div>
<div id="tapLayer"></div>

<script>
// ============================================================
// ✏️ 여기만 수정하세요!
// 왼쪽: 주소 끝에 붙을 이름 (?t=track01)
// file: 같은 폴더에 올린 mp3 파일 이름 / title: 화면 제목
// prompt: 작곡에 쓴 프롬프트 (` ` 기호 사이에 쓰면 여러 줄도 그대로 나와요. 비워두면 상자가 안 보여요)
// ============================================================
const TRACKS = {
  "track01": {
    file: "Solitary Hope.mp3",
    title: "1번 노래",
    prompt: `Instrumental cinematic ambient post-rock with minimalist pacing at 60 bpm, Begin with isolated felt-piano notes, close and dry, over a deep sustained dark drone and faint lo-fi dust texture, Let the harmony unfold slowly; introduce a fragile solo cello that swells in long expressive phrases, with sparse glass-bell tones appearing later, Build gently without a beat, keeping the arrangement spacious, solitary, surreal, and gloomy, then turn the final harmony toward poignant hope, Wide cinematic reverb on cello and bells, piano remains intimate, restrained dynamics, soft unresolved ending`
  },
  "track02": {
    file: "track02.mp3",
    title: "2번 노래",
    prompt: ``
  },
  "track03": {
    file: "track03.mp3",
    title: "3번 노래",
    prompt: ``
  },
};
// ============================================================

const main = document.getElementById("main");
const tapLayer = document.getElementById("tapLayer");
const code = new URLSearchParams(location.search).get("t");
const track = TRACKS[code];

if (!track) {
  // 주소에 곡 이름이 없으면 전체 목록을 보여줌
  main.innerHTML = '<p class="title">🎧 곡 목록</p><ul>' +
    Object.entries(TRACKS).map(([k, t]) =>
      `<li><a href="?t=${k}">▶ ${t.title}</a></li>`).join("") + "</ul>";
} else {
  main.innerHTML = `
    <a id="backBtn" href="./">← 목록</a>
    <p class="title">${track.title}</p>
    <div class="icon" id="icon">▶</div>
    <p class="hint" id="hint">불러오는 중...</p>
    <audio id="player" src="${track.file}" controls playsinline preload="auto"></audio>
    <div class="prompt" id="promptBox">
      <p class="prompt-label">PROMPT</p>
      <p class="prompt-text" id="promptText"></p>
    </div>`;

  // 프롬프트 넣기 (비어 있으면 상자 숨김)
  const promptText = (track.prompt || "").trim();
  if (promptText) {
    document.getElementById("promptText").textContent = promptText;
  } else {
    document.getElementById("promptBox").style.display = "none";
  }

  const player = document.getElementById("player");
  const icon = document.getElementById("icon");
  const hint = document.getElementById("hint");

  // 목록으로 돌아갈 때 노래 멈추기
  document.getElementById("backBtn").addEventListener("click", () => {
    player.pause();
    player.currentTime = 0;
  });
  // 휴대폰 뒤로가기나 창 닫기 때도 멈추기
  window.addEventListener("pagehide", () => player.pause());

  function update() {
    icon.textContent = player.paused ? "▶" : "❚❚";
    hint.textContent = player.paused ? "" : "재생 중";
  }
  player.addEventListener("play", update);
  player.addEventListener("pause", update);
  player.addEventListener("ended", update);

  icon.addEventListener("click", () => {
    player.paused ? player.play() : player.pause();
  });

  // 1) 먼저 바로 재생을 시도
  player.play().then(update).catch(() => {
    // 2) 휴대폰이 자동재생을 막으면, 화면 아무 곳이나 한 번 누르면 재생
    hint.textContent = "화면을 한 번 터치하면 재생돼요";
    tapLayer.style.display = "block";
    tapLayer.addEventListener("click", () => {
      tapLayer.style.display = "none";
      player.play();
    }, { once: true });
  });
}
</script>
</body>
</html>
