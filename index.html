<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Doodle AR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#09090b; --panel:#0f0f11; --line:#27272a; --line-2:#3f3f46;
    --fg:#fafafa; --muted:#a1a1aa; --dim:#71717a;
    --paper:#f4f4f5; --paper-dark:#18181b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
  body{
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  button,input,a{font:inherit;color:inherit}

  /* ---------- Toolbar ---------- */
  #toolbar{
    flex:none;display:flex;align-items:center;gap:8px;height:56px;
    padding:0 12px;padding-top:env(safe-area-inset-top);box-sizing:content-box;
    background:var(--panel);border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none;touch-action:pan-x;
  }
  #toolbar::-webkit-scrollbar{display:none}
  .group{display:flex;align-items:center;gap:2px;padding-right:8px;border-right:1px solid var(--line);flex:none}
  .group:last-of-type{border-right:none}
  .spacer{flex:1 0 8px}
  .btn{
    height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);
    font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;
  }
  .btn:hover{color:var(--fg);background:#18181b}
  .btn:disabled{opacity:.35;pointer-events:none}
  .btn[aria-pressed="true"]{color:var(--fg);background:#27272a;border-color:var(--line-2)}
  .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn .lbl{display:none}
  @media (min-width:980px){.btn .lbl{display:inline}}
  .btn.primary{background:var(--fg);color:#09090b;padding:0 14px}
  .btn.primary .lbl{display:inline}
  .btn.primary:hover{background:#e4e4e7;color:#09090b}

  .size{display:flex;align-items:center;gap:8px;padding:0 6px}
  .size output{width:22px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:20px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2);border-radius:2px}
  input[type=range]::-moz-range-track{height:2px;background:var(--line-2);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--fg);border:none}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:none}

  .swatches{display:flex;align-items:center;gap:6px;padding:0 4px}
  .sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;padding:0;flex:none}
  .sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
  .picker{position:relative;width:28px;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);flex:none;cursor:pointer}
  .picker input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:none;padding:0;cursor:pointer;background:none}

  /* ---------- Stage ---------- */
  #stage{position:relative;flex:1;min-height:0;background:var(--paper);touch-action:none;transition:background .2s}
  #stage.dark{background:var(--paper-dark)}
  #draw{position:absolute;inset:0;display:block;touch-action:none;cursor:none}
  #draw.fill{cursor:crosshair}
  #cursor{
    position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;z-index:10;display:none;
    border:1px solid rgba(9,9,11,.75);box-shadow:0 0 0 1px rgba(250,250,250,.75);transform:translate(-50%,-50%);
  }
  #cursor.eraser{border-style:dashed}
  .empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    color:#a1a1aa;font-size:13px;letter-spacing:.02em;transition:opacity .2s
  }
  #stage.dark .empty{color:#52525b}
  .empty.hide{opacity:0}

  /* ---------- AR view ---------- */
  #ar{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden}
  #ar.open{display:block}
  #ar.nocam{background:#111113}
  #ar video,#ar canvas.gl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #ar canvas.gl{touch-action:none}
  #ar.nocam video{display:none}
  #ar.xr{background:transparent}
  #ar.xr video,#ar.xr canvas.gl{visibility:hidden}
  #arUI{position:absolute;inset:0;pointer-events:none}
  .ar-top{
    position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));
    display:flex;justify-content:space-between;align-items:center
  }
  .ar-bottom{
    position:absolute;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:10px
  }
  .chip{
    pointer-events:auto;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;
    background:rgba(9,9,11,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;color:var(--fg);
    font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap
  }
  .chip.icon{width:40px;padding:0;justify-content:center}
  .chip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .chip[hidden]{display:none}
  .badge{height:28px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:default}
  .hint{
    max-width:100%;padding:7px 14px;border-radius:999px;background:rgba(9,9,11,.6);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:#d4d4d8;font-size:12px;text-align:center
  }
  .ar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #qlLink img{width:1px;height:1px;opacity:0;position:absolute}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:100;
    transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    background:#fafafa;color:#09090b;font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;
    max-width:calc(100% - 32px);text-align:center
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #ar.open ~ #toast{bottom:auto;top:max(64px,calc(env(safe-area-inset-top) + 56px))}
</style>
</head>
<body>

<header id="toolbar" role="toolbar" aria-label="드로잉 도구">
  <div class="group">
    <button class="btn" data-tool="pen" aria-pressed="true" title="펜 (B)">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="lbl">펜</span>
    </button>
    <button class="btn" data-tool="eraser" aria-pressed="false" title="지우개 (E)">
      <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span class="lbl">지우개</span>
    </button>
    <button class="btn" data-tool="fill" aria-pressed="false" title="채우기 (G)">
      <svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg><span class="lbl">채우기</span>
    </button>
  </div>

  <div class="group">
    <div class="size" title="브러시 크기 ( [ / ] )">
      <input id="size" type="range" min="1" max="60" value="8" aria-label="브러시 크기">
      <output id="sizeOut">8</output>
    </div>
  </div>

  <div class="group">
    <div class="swatches" id="swatches">
      <button class="sw" data-c="#18181b" style="background:#18181b" aria-pressed="true" aria-label="검정"></button>
      <button class="sw" data-c="#fafafa" style="background:#fafafa" aria-pressed="false" aria-label="흰색"></button>
      <button class="sw" data-c="#ef4444" style="background:#ef4444" aria-pressed="false" aria-label="빨강"></button>
      <button class="sw" data-c="#f59e0b" style="background:#f59e0b" aria-pressed="false" aria-label="주황"></button>
      <button class="sw" data-c="#22c55e" style="background:#22c55e" aria-pressed="false" aria-label="초록"></button>
      <button class="sw" data-c="#3b82f6" style="background:#3b82f6" aria-pressed="false" aria-label="파랑"></button>
    </div>
    <label class="picker" title="색상 선택"><input id="color" type="color" value="#18181b" aria-label="색상 선택"></label>
  </div>

  <div class="group">
    <button class="btn" id="undo" title="실행 취소 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl">실행 취소</span>
    </button>
    <button class="btn" id="clear" title="전체 지우기">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="lbl">전체 지우기</span>
    </button>
    <button class="btn" id="bg" title="캔버스 배경 밝기 전환">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" style="fill:currentColor"/></svg><span class="lbl">배경</span>
    </button>
    <button class="btn" id="save" title="투명 PNG 저장">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lbl">PNG</span>
    </button>
  </div>

  <div class="spacer"></div>
  <button class="btn primary" id="arBtn" title="AR로 보기">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg><span class="lbl">AR 보기</span>
  </button>
</header>

<main id="stage">
  <canvas id="draw"></canvas>
  <div class="empty" id="empty">여기에 낙서를 그려 보세요</div>
</main>
<div id="cursor"></div>

<div id="ar" aria-hidden="true">
  <video id="cam" playsinline muted autoplay></video>
  <div id="arUI">
    <div class="ar-top">
      <button class="chip icon" id="arClose" aria-label="드로잉으로 돌아가기">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <span class="chip badge" id="arMode">Camera</span>
    </div>
    <div class="ar-bottom">
      <p class="hint" id="arHint"></p>
      <div class="ar-actions">
        <button class="chip" id="arReset">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>초기화
        </button>
        <button class="chip" id="arShot">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.5"/><path d="M5 7h2.5L9 5h6l1.5 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/></svg>캡처
        </button>
        <a class="chip" id="qlLink" rel="ar" hidden><img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
          <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Quick Look AR
        </a>
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let toastTimer;
function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// iOS Safari 핀치 확대 / 길게 누르기 메뉴 차단
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* =====================================================================
   1. DRAWING
   ===================================================================== */
const stage = $('#stage');
const cvs = $('#draw');
const ctx = cvs.getContext('2d', { willReadFrequently: true });
const cursorEl = $('#cursor');

const state = { tool: 'pen', size: 8, color: '#18181b' };
let dpr = 1;
let dirty = false;

const undoStack = [];
const UNDO_MAX = 15;

function resizeCanvas() {
  const r = stage.getBoundingClientRect();
  const nd = Math.min(window.devicePixelRatio || 1, 3);
  const nw = Math.max(1, Math.round(r.width * nd));
  const nh = Math.max(1, Math.round(r.height * nd));
  if (nw === cvs.width && nh === cvs.height) return;

  let snapshot = null;
  if (cvs.width > 1 && cvs.height > 1) {
    snapshot = document.createElement('canvas');
    snapshot.width = cvs.width; snapshot.height = cvs.height;
    snapshot.getContext('2d').drawImage(cvs, 0, 0);
  }
  cvs.width = nw; cvs.height = nh;
  cvs.style.width = r.width + 'px';
  cvs.style.height = r.height + 'px';
  dpr = nd;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (snapshot) ctx.drawImage(snapshot, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resizeCanvas).observe(stage);
resizeCanvas();

function pos(e) {
  const r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function setDirty(v) {
  dirty = v;
  $('#empty').classList.toggle('hide', v);
}

/* ---- Undo ---- */
function pushUndo() {
  undoStack.push(ctx.getImageData(0, 0, cvs.width, cvs.height));
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  $('#undo').disabled = false;
}
function undo() {
  const s = undoStack.pop();
  if (!s) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.restore();
  ctx.putImageData(s, 0, 0);
  $('#undo').disabled = undoStack.length === 0;
  setDirty(hasInk());
}
function clearAll() {
  if (!dirty) return;
  pushUndo();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.restore();
  setDirty(false);
}
function hasInk() {
  const d = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
  for (let i = 3; i < d.length; i += 16) if (d[i] > 8) return true;
  return false;
}

/* ---- Stroke ---- */
let active = null;

function applyStyle() {
  ctx.globalCompositeOperation = state.tool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = state.color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function pressureWidth(e) {
  const mult = state.tool === 'eraser' ? 2 : 1;
  if (e.pointerType === 'pen' && e.pressure > 0) return state.size * mult * (0.2 + e.pressure * 1.0);
  return state.size * mult;
}
function segment(p, w) {
  const a = active;
  const mid = { x: (a.last.x + p.x) / 2, y: (a.last.y + p.y) / 2 };
  ctx.lineWidth = (a.w + w) / 2;
  ctx.beginPath();
  ctx.moveTo(a.lastMid.x, a.lastMid.y);
  ctx.quadraticCurveTo(a.last.x, a.last.y, mid.x, mid.y);
  ctx.stroke();
  a.last = p; a.lastMid = mid; a.w = w;
}

cvs.addEventListener('pointerdown', (e) => {
  if (active) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const p = pos(e);

  if (state.tool === 'fill') {
    pushUndo();
    const changed = floodFill(Math.floor(p.x * dpr), Math.floor(p.y * dpr), state.color);
    if (!changed) { undoStack.pop(); $('#undo').disabled = undoStack.length === 0; }
    else setDirty(true);
    return;
  }

  pushUndo();
  applyStyle();
  cvs.setPointerCapture(e.pointerId);
  const w = pressureWidth(e);
  active = { id: e.pointerId, last: p, lastMid: p, w };
  ctx.beginPath();
  ctx.arc(p.x, p.y, w / 2, 0, Math.PI * 2);
  ctx.fill();
  if (state.tool === 'pen') setDirty(true);
});

cvs.addEventListener('pointermove', (e) => {
  moveCursor(e);
  if (!active || e.pointerId !== active.id) return;
  const list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (list.length ? list : [e])) segment(pos(ev), pressureWidth(ev));
});

function endStroke(e) {
  if (!active || e.pointerId !== active.id) return;
  const a = active;
  ctx.lineWidth = a.w;
  ctx.beginPath();
  ctx.moveTo(a.lastMid.x, a.lastMid.y);
  ctx.lineTo(a.last.x, a.last.y);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  active = null;
  if (state.tool === 'eraser') setDirty(hasInk());
}
cvs.addEventListener('pointerup', endStroke);
cvs.addEventListener('pointercancel', endStroke);
cvs.addEventListener('lostpointercapture', endStroke);
cvs.addEventListener('pointerleave', () => { cursorEl.style.display = 'none'; });
cvs.addEventListener('contextmenu', (e) => e.preventDefault());

function moveCursor(e) {
  if (e.pointerType === 'touch' || state.tool === 'fill') { cursorEl.style.display = 'none'; return; }
  const s = state.tool === 'eraser' ? state.size * 2 : state.size;
  cursorEl.style.display = 'block';
  cursorEl.style.width = cursorEl.style.height = Math.max(4, s) + 'px';
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top = e.clientY + 'px';
}

/* ---- Flood fill (scanline + 경계 안티앨리어싱 보정) ---- */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function floodFill(sx, sy, hex) {
  const w = cvs.width, h = cvs.height;
  if (sx < 0 || sy < 0 || sx >= w || sy >= h) return false;
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const s = (sy * w + sx) * 4;
  const tr = d[s], tg = d[s + 1], tb = d[s + 2], ta = d[s + 3];
  const [fr, fg, fb] = hexToRgb(hex);
  if (ta === 255 && Math.abs(tr - fr) + Math.abs(tg - fg) + Math.abs(tb - fb) < 6) return false;

  const TOL = 90;
  const clearTarget = ta < 16;
  const match = (i) => clearTarget
    ? d[i + 3] < 40
    : (Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) + Math.abs(d[i + 3] - ta)) <= TOL;

  const mask = new Uint8Array(w * h);
  const stack = [sy * w + sx];
  while (stack.length) {
    const p = stack.pop();
    if (mask[p] || !match(p * 4)) continue;
    const y = (p / w) | 0, row = y * w;
    let l = p - row, r = l;
    while (l > 0 && !mask[row + l - 1] && match((row + l - 1) * 4)) l--;
    while (r < w - 1 && !mask[row + r + 1] && match((row + r + 1) * 4)) r++;
    let up = false, dn = false;
    for (let x = l; x <= r; x++) {
      const q = row + x;
      mask[q] = 1;
      if (y > 0) {
        const u = q - w, ok = !mask[u] && match(u * 4);
        if (ok && !up) { stack.push(u); up = true; } else if (!ok) up = false;
      }
      if (y < h - 1) {
        const v = q + w, ok = !mask[v] && match(v * 4);
        if (ok && !dn) { stack.push(v); dn = true; } else if (!ok) dn = false;
      }
    }
  }

  // 2px 팽창: 선의 반투명 가장자리 아래까지 색을 깔아 틈(헤일로) 제거
  for (let pass = 0; pass < 2; pass++) {
    const src = mask.slice();
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        const p = row + x;
        if (src[p]) continue;
        if ((x > 0 && src[p - 1]) || (x < w - 1 && src[p + 1]) || (y > 0 && src[p - w]) || (y < h - 1 && src[p + w])) mask[p] = 2;
      }
    }
  }

  for (let p = 0, i = 0; p < mask.length; p++, i += 4) {
    const m = mask[p];
    if (!m) continue;
    if (m === 1) {
      d[i] = fr; d[i + 1] = fg; d[i + 2] = fb; d[i + 3] = 255;
    } else {
      const a = d[i + 3] / 255;
      d[i] = d[i] * a + fr * (1 - a);
      d[i + 1] = d[i + 1] * a + fg * (1 - a);
      d[i + 2] = d[i + 2] * a + fb * (1 - a);
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return true;
}

/* ---- Export: 그림 영역만 잘라 투명 PNG로 ---- */
function exportDrawing(maxSize = 1024) {
  const w = cvs.width, h = cvs.height;
  const d = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    const row = y * w * 4;
    for (let x = 0; x < w; x++) {
      if (d[row + x * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  const pad = Math.round(6 * dpr);
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const k = Math.min(1, maxSize / Math.max(cw, ch));
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(cw * k));
  out.height = Math.max(1, Math.round(ch * k));
  const o = out.getContext('2d');
  o.imageSmoothingQuality = 'high';
  o.drawImage(cvs, minX, minY, cw, ch, 0, 0, out.width, out.height);
  return { url: out.toDataURL('image/png'), w: out.width, h: out.height };
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---- Toolbar wiring ---- */

window.addEventListener('keydown', (e) => {
  if ($('#ar').classList.contains('open')) { if (e.key === 'Escape') closeAR(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'b' || k === 'p') setTool('pen');
  else if (k === 'e') setTool('eraser');
  else if (k === 'g' || k === 'f') setTool('fill');
  else if (k === '[') setSize(state.size - 2);

});

/* =====================================================================
   2. AR VIEW (Three.js)
   ===================================================================== */
const arEl = $('#ar');
const video = $('#cam');
const hintEl = $('#arHint');

let renderer, scene, camera, controller, reticle, grid;
const raycaster = new THREE.Raycaster();
const clock = new THREE.Clock();
let asset = null;
let doodles = [];
let mode = null;          // 'camera' | 'xr'
let stream = null;
let xrSupported = false;
let xrRefSpace = null, hitSource = null, transientSource = null, xrDrag = null, floorFound = false;

if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-ar').then((v) => { xrSupported = v; }).catch(() => {});
}

function setHint(t) { hintEl.textContent = t; }

function initThree() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.xr.enabled = true;
  renderer.domElement.className = 'gl';
  arEl.insertBefore(renderer.domElement, $('#arUI'));

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);

  // 바닥 인식 레티클 (WebXR)
  const ring = new THREE.RingGeometry(0.07, 0.085, 48).rotateX(-Math.PI / 2);
  const dot = new THREE.CircleGeometry(0.008, 16).rotateX(-Math.PI / 2);
  const rmat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthWrite: false });
  reticle = new THREE.Group();
  reticle.add(new THREE.Mesh(ring, rmat), new THREE.Mesh(dot, rmat));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // 카메라 미사용 시 공간감을 위한 바닥 그리드
  grid = new THREE.GridHelper(3, 30, 0x3f3f46, 0x27272a);
  grid.visible = false;
  scene.add(grid);

  // WebXR 화면 터치 입력
  controller = renderer.xr.getController(0);
  controller.addEventListener('selectstart', onXRSelectStart);
  controller.addEventListener('selectend', () => { xrDrag = null; });
  scene.add(controller);

  const el = renderer.domElement;
  el.addEventListener('pointerdown', onCamDown);
  el.addEventListener('pointermove', onCamMove);
  el.addEventListener('pointerup', onCamUp);
  el.addEventListener('pointercancel', onCamUp);
  el.addEventListener('wheel', onCamWheel, { passive: false });
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('resize', onResize);
}

function onResize() {
  if (!renderer || renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}

/* ---- 드로잉 → 2.5D 메쉬 에셋 ---- */
let shadowTex = null;
function getShadowTexture() {
  if (shadowTex) return shadowTex;
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.38)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  shadowTex = new THREE.CanvasTexture(c);
  return shadowTex;
}

function disposeAsset() {
  if (!asset) return;
  asset.tex.dispose();
  [asset.geo, asset.hitGeo, asset.shadowGeo].forEach((g) => g.dispose());
  [asset.faceMat, asset.sideMat, asset.shadowMat, asset.hitMat].forEach((m) => m.dispose());
  asset = null;
}

async function buildAsset(ex) {
  disposeAsset();
  const tex = await new THREE.TextureLoader().loadAsync(ex.url);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.premultiplyAlpha = true; // 가장자리 검은 테두리 방지
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const MAX = 0.35; // 최장변 35cm
  let w, h;
  if (ex.w >= ex.h) { w = MAX; h = MAX * ex.h / ex.w; } else { h = MAX; w = MAX * ex.w / ex.h; }

  const geo = new THREE.PlaneGeometry(w, h);
  const faceMat = new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide, transparent: true, alphaTest: 0.01,
    blending: THREE.CustomBlending,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  });
  const sideMat = new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide, alphaTest: 0.5, color: new THREE.Color(0.42, 0.42, 0.45),
  });
  const hitGeo = new THREE.BoxGeometry(w, h, 0.05);
  const hitMat = new THREE.MeshBasicMaterial();
  const sr = Math.max(w * 1.15, 0.12);
  const shadowGeo = new THREE.PlaneGeometry(sr, sr * 0.45).rotateX(-Math.PI / 2);
  const shadowMat = new THREE.MeshBasicMaterial({ map: getShadowTexture(), transparent: true, depthWrite: false });

  asset = { tex, w, h, geo, faceMat, sideMat, hitGeo, hitMat, shadowGeo, shadowMat, url: ex.url };
}

function makeDoodle() {
  const A = asset;
  const root = new THREE.Group();   // 위치 · 방향
  const pivot = new THREE.Group();  // 크기 · 바운스 (바닥 기준)
  const body = new THREE.Group();   // 회전 애니메이션
  body.position.y = A.h / 2;
  pivot.add(body);
  root.add(pivot);

  // 레이어를 겹쳐 두께감 있는 2.5D 스티커 형태로
  const N = 8, D = 0.014;
  for (let i = 0; i < N; i++) {
    const face = i === 0 || i === N - 1;
    const m = new THREE.Mesh(A.geo, face ? A.faceMat : A.sideMat);
    m.position.z = -D * i / (N - 1);
    body.add(m);
  }
  const hit = new THREE.Mesh(A.hitGeo, A.hitMat);
  hit.visible = false;
  hit.position.z = -D / 2;
  hit.userData.root = root;
  body.add(hit);

  const shadow = new THREE.Mesh(A.shadowGeo, A.shadowMat);
  shadow.position.y = 0.002;
  root.add(shadow);

  root.userData = { pivot, body, shadow, hit, s: 1, b: -1, appear: 0, phase: Math.random() * Math.PI * 2 };
  return root;
}

function clearDoodles() {
  doodles.forEach((d) => scene.remove(d));
  doodles = [];
}

function bounce(o) {
  o.userData.b = 0;
  if (navigator.vibrate) navigator.vibrate(12);
}

function updateDoodle(o, dt, t) {
  const u = o.userData;
  let sq = 0, hop = 0, spin = 0;
  if (u.appear < 1) u.appear = Math.min(1, u.appear + dt / 0.55);
  if (u.b >= 0) {
    u.b += dt;
    const k = u.b;
    sq = Math.exp(-4.5 * k) * Math.sin(k * 20) * 0.22;           // 스쿼시 & 스트레치
    hop = k < 0.42 ? Math.sin(Math.PI * k / 0.42) : 0;            // 점프
    spin = easeOutCubic(Math.min(k / 0.8, 1));                     // 한 바퀴 회전
    if (k > 1.8) u.b = -1;
  }
  const s = u.s * easeOutBack(u.appear);
  u.pivot.scale.set(s * (1 + sq), s * (1 - sq), s * (1 + sq));
  u.pivot.position.y = hop * 0.12 * u.s;
  u.body.rotation.y = spin * Math.PI * 2;
  u.body.rotation.z = Math.sin(t * 1.3 + u.phase) * 0.03;          // 잔잔한 흔들림
  u.shadow.scale.setScalar(Math.max(0.001, s * (1 - hop * 0.35)));
}

function pickDoodle() {
  const hits = raycaster.intersectObjects(doodles.map((d) => d.userData.hit), false);
  return hits.length ? hits[0] : null;
}

/* ---- Render loop ---- */
function loop(time, frame) {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (frame && mode === 'xr') xrUpdate(frame);
  if (mode === 'camera') applyInertia(dt);
  for (const o of doodles) updateDoodle(o, dt, t);
  renderer.render(scene, camera);
}

/* ---- Open / close ---- */
async function openAR() {
  const ex = exportDrawing();
  if (!ex) { toast('먼저 낙서를 그려 주세요'); return; }
  initThree();
  const btn = $('#arBtn');
  btn.disabled = true;
  try {
    await buildAsset(ex);
    if (xrSupported) {
      try { await startXR(); return; }
      catch (err) {
        console.warn(err);
        arEl.classList.remove('open', 'xr');
        toast('WebXR을 시작할 수 없어 카메라 모드로 전환합니다');
      }
    }
    await startCameraMode();
  } finally {
    btn.disabled = false;
  }
}

function closeAR() {
  const session = renderer && renderer.xr.getSession();
  if (session) { session.end(); return; } // 'end' 이벤트에서 teardown
  teardown();
}

function teardown() {
  if (renderer) renderer.setAnimationLoop(null);
  if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
  video.srcObject = null;
  clearDoodles();
  if (reticle) reticle.visible = false;
  hitSource = transientSource = xrDrag = null;
  mode = null;
  arEl.className = '';
  arEl.setAttribute('aria-hidden', 'true');
  const ql = $('#qlLink');
  if (ql.href && ql.href.startsWith('blob:')) URL.revokeObjectURL(ql.href);
  ql.removeAttribute('href');
  ql.hidden = true;
}

$('#arBtn').addEventListener('click', openAR);
$('#arClose').addEventListener('click', closeAR);
$('#arReset').addEventListener('click', () => {
  if (mode === 'camera' && doodles[0]) {
    const o = doodles[0];
    o.position.set(0, 0, 0); o.rotation.set(0, 0, 0);
    o.userData.s = 1; rotVel = 0; bounce(o);
  } else if (mode === 'xr') {
    clearDoodles();
    setHint(floorFound ? '바닥을 탭하여 낙서를 배치하세요' : '바닥을 천천히 비춰 주세요');
  }
});
$('#arShot').addEventListener('click', capture);
// WebXR dom-overlay: UI 버튼 탭이 3D select로 새지 않게
$$('.ar-top, .ar-actions').forEach((el) => el.addEventListener('beforexrselect', (e) => e.preventDefault()));

/* ---- iOS: Quick Look(USDZ) ---- */
async function prepareQuickLook() {
  const link = $('#qlLink');
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = asset.url; });
    const tex = new THREE.Texture(img);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    const mat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 1, metalness: 0 });
    const g = new THREE.Group();
    const m = new THREE.Mesh(asset.geo, mat);
    m.position.y = asset.h / 2;
    g.add(m);
    const buf = await new USDZExporter().parseAsync(g);
    if (mode !== 'camera') return;
    link.href = URL.createObjectURL(new Blob([buf], { type: 'model/vnd.usdz+zip' }));
    link.hidden = false;
    mat.dispose(); tex.dispose();
  } catch (err) {
    console.warn('USDZ export failed', err);
  }
}

/* ---- Camera overlay mode (iOS · 데스크톱 · WebXR 미지원 기기) ---- */
async function startCameraMode() {
  mode = 'camera';
  arEl.className = 'open';
  arEl.setAttribute('aria-hidden', 'false');
  $('#arMode').textContent = 'Camera';
  $('#arShot').hidden = false;
  grid.visible = false;

  camera.fov = 50;
  camera.position.set(0, 0.24, 0.95);
  camera.lookAt(0, 0.16, 0);
  onResize();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    console.warn(err);
    arEl.classList.add('nocam');
    grid.visible = true;
    toast('카메라를 사용할 수 없어 3D 미리보기로 표시합니다');
  }
  if (mode !== 'camera') return;

  clearDoodles();
  const o = makeDoodle();
  scene.add(o);
  doodles.push(o);
  setHint('탭: 튀어오르기 · 드래그: 회전(빈 곳) / 이동(낙서) · 핀치: 크기');
  clock.getDelta();
  renderer.setAnimationLoop(loop);
  setTimeout(() => bounce(o), 350);

  if (isIOS) prepareQuickLook();
}

const ptrs = new Map();
let gesture = null, rotVel = 0, lastRotT = 0;
const dragPlane = new THREE.Plane();
const tmpV = new THREE.Vector3();

function ndc(e) {
  const r = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pairDist() {
  const [a, b] = [...ptrs.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function onCamDown(e) {
  if (mode !== 'camera' || !doodles[0]) return;
  e.preventDefault();
  renderer.domElement.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const o = doodles[0];

  if (ptrs.size === 1) {
    raycaster.setFromCamera(ndc(e), camera);
    const hit = pickDoodle();
    gesture = { type: hit ? 'move' : 'rotate', sx: e.clientX, sy: e.clientY, lx: e.clientX, t: performance.now(), hit: !!hit, moved: false };
    rotVel = 0;
    if (hit) {
      const n = camera.getWorldDirection(new THREE.Vector3()).negate();
      dragPlane.setFromNormalAndCoplanarPoint(n, o.position);
      gesture.off = raycaster.ray.intersectPlane(dragPlane, tmpV) ? o.position.clone().sub(tmpV) : new THREE.Vector3();
    }
  } else if (ptrs.size === 2) {
    gesture = { type: 'pinch', d0: Math.max(1, pairDist()), s0: o.userData.s };
  }
}

function onCamMove(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (!gesture) return;
  const o = doodles[0];

  if (gesture.type === 'pinch') {
    if (ptrs.size >= 2) o.userData.s = clamp(gesture.s0 * pairDist() / gesture.d0, 0.3, 3);
    return;
  }
  if (Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 6) gesture.moved = true;
  if (!gesture.moved) return;

  if (gesture.type === 'rotate') {
    const dx = e.clientX - gesture.lx;
    o.rotation.y += dx * 0.012;
    rotVel = dx * 0.012;
    lastRotT = performance.now();
    gesture.lx = e.clientX;
  } else if (gesture.type === 'move') {
    raycaster.setFromCamera(ndc(e), camera);
    if (raycaster.ray.intersectPlane(dragPlane, tmpV)) o.position.copy(tmpV).add(gesture.off);
  }
}

function onCamUp(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && gesture.type !== 'pinch' && !gesture.moved && gesture.hit && performance.now() - gesture.t < 400) {
    bounce(doodles[0]);
  }
  if (gesture && gesture.type === 'rotate' && performance.now() - lastRotT > 80) rotVel = 0;
  if (ptrs.size === 0 || (gesture && gesture.type === 'pinch')) gesture = null;
}

function onCamWheel(e) {
  if (mode !== 'camera' || !doodles[0]) return;
  e.preventDefault();
  const u = doodles[0].userData;
  u.s = clamp(u.s * Math.exp(-e.deltaY * 0.0015), 0.3, 3);
}

function applyInertia(dt) {
  if (!doodles[0] || (gesture && gesture.type === 'rotate')) return;
  if (Math.abs(rotVel) < 0.0002) { rotVel = 0; return; }
  doodles[0].rotation.y += rotVel;
  rotVel *= Math.pow(0.92, dt * 60);
}

function capture() {
  if (mode !== 'camera') return;
  const W = renderer.domElement.width, H = renderer.domElement.height;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  if (stream && video.videoWidth) {
    const vr = video.videoWidth / video.videoHeight, cr = W / H;
    let sw, sh, sx, sy;
    if (vr > cr) { sh = video.videoHeight; sw = sh * cr; sx = (video.videoWidth - sw) / 2; sy = 0; }
    else { sw = video.videoWidth; sh = sw / cr; sx = 0; sy = (video.videoHeight - sh) / 2; }
    x.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  } else {
    x.fillStyle = '#111113';
    x.fillRect(0, 0, W, H);
  }
  renderer.render(scene, camera);
  x.drawImage(renderer.domElement, 0, 0);
  download(c.toDataURL('image/png'), 'doodle-ar.png');
  toast('캡처 이미지를 저장했습니다');
}

/* ---- WebXR immersive-ar mode (Android Chrome 등) ---- */
async function startXR() {
  arEl.className = 'open xr';
  arEl.setAttribute('aria-hidden', 'false');
  $('#arMode').textContent = 'WebXR';
  $('#arShot').hidden = true;
  grid.visible = false;

  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: arEl },
  });
  mode = 'xr';
  floorFound = false;
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  xrRefSpace = renderer.xr.getReferenceSpace();

  const viewer = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({ space: viewer });
  if (session.requestHitTestSourceForTransientInput) {
    session.requestHitTestSourceForTransientInput({ profile: 'generic-touchscreen' })
      .then((s) => { transientSource = s; }).catch(() => {});
  }
  session.addEventListener('end', () => {
    if (hitSource) { try { hitSource.cancel(); } catch {} }
    teardown();
  });

  clearDoodles();
  setHint('바닥을 천천히 비춰 주세요');
  clock.getDelta();
  renderer.setAnimationLoop(loop);
}

function xrUpdate(frame) {
  if (hitSource) {
    const results = frame.getHitTestResults(hitSource);
    if (results.length) {
      const pose = results[0].getPose(xrRefSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      if (!floorFound) {
        floorFound = true;
        if (!doodles.length) setHint('바닥을 탭하여 낙서를 배치하세요');
      }
    } else {
      reticle.visible = false;
    }
  }

  if (xrDrag && transientSource) {
    for (const r of frame.getHitTestResultsForTransientInput(transientSource)) {
      if (!r.results.length) continue;
      const p = r.results[0].getPose(xrRefSpace).transform.position;
      const o = xrDrag.obj;
      if (!xrDrag.off) xrDrag.off = new THREE.Vector3(o.position.x - p.x, 0, o.position.z - p.z);
      o.position.set(p.x + xrDrag.off.x, p.y, p.z + xrDrag.off.z);
      break;
    }
  }
}

function faceCamera(o) {
  const cam = renderer.xr.getCamera();
  const cp = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
  o.rotation.y = Math.atan2(cp.x - o.position.x, cp.z - o.position.z);
}

function onXRSelectStart() {
  if (mode !== 'xr' || !asset) return;
  raycaster.setFromXRController(controller);
  const hit = pickDoodle();
  if (hit) {
    const o = hit.object.userData.root;
    bounce(o);
    xrDrag = { obj: o, off: null };
    return;
  }
  if (!reticle.visible) return;
  if (doodles.length >= 12) scene.remove(doodles.shift());
  const o = makeDoodle();
  o.position.setFromMatrixPosition(reticle.matrix);
  faceCamera(o);
  scene.add(o);
  doodles.push(o);
  setHint('낙서 탭: 튀어오르기 · 누른 채 끌기: 이동 · 빈 바닥 탭: 하나 더 배치');
}
</script>
