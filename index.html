<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Doodle AR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#09090b; --panel:#0f0f11; --line:#27272a; --line-2:#3f3f46;
    --fg:#fafafa; --muted:#a1a1aa; --dim:#71717a;
    --paper:#f4f4f5; --paper-dark:#18181b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
  body{
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  button,input,a{font:inherit;color:inherit}

  /* ---------- Toolbar ---------- */
  #toolbar{
    flex:none;display:flex;align-items:center;gap:8px;height:56px;
    padding:0 12px;padding-top:env(safe-area-inset-top);box-sizing:content-box;
    background:var(--panel);border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none;touch-action:pan-x;
  }
  #toolbar::-webkit-scrollbar{display:none}
  .group{display:flex;align-items:center;gap:2px;padding-right:8px;border-right:1px solid var(--line);flex:none}
  .group:last-of-type{border-right:none}
  .spacer{flex:1 0 8px}
  .btn{
    height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);
    font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;
  }
  .btn:hover{color:var(--fg);background:#18181b}
  .btn:disabled{opacity:.35;pointer-events:none}
  .btn[aria-pressed="true"]{color:var(--fg);background:#27272a;border-color:var(--line-2)}
  .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn .lbl{display:none}
  @media (min-width:980px){.btn .lbl{display:inline}}
  .btn.primary{background:var(--fg);color:#09090b;padding:0 14px}
  .btn.primary .lbl{display:inline}
  .btn.primary:hover{background:#e4e4e7;color:#09090b}

  .size{display:flex;align-items:center;gap:8px;padding:0 6px}
  .size output{width:22px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:96px;height:20px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2);border-radius:2px}
  input[type=range]::-moz-range-track{height:2px;background:var(--line-2);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:var(--fg);border:none}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:none}

  .swatches{display:flex;align-items:center;gap:6px;padding:0 4px}
  .sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;padding:0;flex:none}
  .sw[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
  .picker{position:relative;width:28px;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line-2);flex:none;cursor:pointer}
  .picker input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:none;padding:0;cursor:pointer;background:none}

  /* ---------- Stage ---------- */
  #stage{position:relative;flex:1;min-height:0;background:var(--paper);touch-action:none;transition:background .2s}
  #stage.dark{background:var(--paper-dark)}
  #draw{position:absolute;inset:0;display:block;touch-action:none;cursor:none}
  #draw.fill{cursor:crosshair}
  #cursor{
    position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;z-index:10;display:none;
    border:1px solid rgba(9,9,11,.75);box-shadow:0 0 0 1px rgba(250,250,250,.75);transform:translate(-50%,-50%);
  }
  #cursor.eraser{border-style:dashed}
  .empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    color:#a1a1aa;font-size:13px;letter-spacing:.02em;transition:opacity .2s
  }
  #stage.dark .empty{color:#52525b}
  .empty.hide{opacity:0}

  /* ---------- AR view ---------- */
  #ar{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden}
  #ar.open{display:block}
  #ar.nocam{background:#111113}
  #ar video,#ar canvas.gl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #ar canvas.gl{touch-action:none}
  #ar.nocam video{display:none}
  #ar.xr{background:transparent}
  #ar.xr video,#ar.xr canvas.gl,#ar.xr #hands{visibility:hidden}
  #ar.mirror video{transform:scaleX(-1)}
  #hands{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ar-top .right{display:flex;gap:8px;align-items:center}
  .chip[aria-pressed="true"]{background:rgba(250,250,250,.92);color:#09090b}
  #arUI{position:absolute;inset:0;pointer-events:none}
  .ar-top{
    position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));
    display:flex;justify-content:space-between;align-items:center
  }
  .ar-bottom{
    position:absolute;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:10px
  }
  .chip{
    pointer-events:auto;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;
    background:rgba(9,9,11,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;color:var(--fg);
    font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap
  }
  .chip.icon{width:40px;padding:0;justify-content:center}
  .chip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .chip[hidden]{display:none}
  .badge{height:28px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:default}
  .hint{
    max-width:100%;padding:7px 14px;border-radius:999px;background:rgba(9,9,11,.6);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:#d4d4d8;font-size:12px;text-align:center
  }
  .ar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #qlLink img{width:1px;height:1px;opacity:0;position:absolute}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:100;
    transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    background:#fafafa;color:#09090b;font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;
    max-width:calc(100% - 32px);text-align:center
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #ar.open ~ #toast{bottom:auto;top:max(64px,calc(env(safe-area-inset-top) + 56px))}
</style>
</head>
<body>

<header id="toolbar" role="toolbar" aria-label="드로잉 도구">
  <div class="group">
    <button class="btn" data-tool="pen" aria-pressed="true" title="펜 (B)">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span class="lbl">펜</span>
    </button>
    <button class="btn" data-tool="eraser" aria-pressed="false" title="지우개 (E)">
      <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span class="lbl">지우개</span>
    </button>
    <button class="btn" data-tool="fill" aria-pressed="false" title="채우기 (G)">
      <svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg><span class="lbl">채우기</span>
    </button>
  </div>

  <div class="group">
    <div class="size" title="브러시 크기 ( [ / ] )">
      <input id="size" type="range" min="1" max="60" value="8" aria-label="브러시 크기">
      <output id="sizeOut">8</output>
    </div>
  </div>

  <div class="group">
    <div class="swatches" id="swatches">
      <button class="sw" data-c="#18181b" style="background:#18181b" aria-pressed="true" aria-label="검정"></button>
      <button class="sw" data-c="#fafafa" style="background:#fafafa" aria-pressed="false" aria-label="흰색"></button>
      <button class="sw" data-c="#ef4444" style="background:#ef4444" aria-pressed="false" aria-label="빨강"></button>
      <button class="sw" data-c="#f59e0b" style="background:#f59e0b" aria-pressed="false" aria-label="주황"></button>
      <button class="sw" data-c="#22c55e" style="background:#22c55e" aria-pressed="false" aria-label="초록"></button>
      <button class="sw" data-c="#3b82f6" style="background:#3b82f6" aria-pressed="false" aria-label="파랑"></button>
    </div>
    <label class="picker" title="색상 선택"><input id="color" type="color" value="#18181b" aria-label="색상 선택"></label>
  </div>

  <div class="group">
    <button class="btn" id="undo" title="실행 취소 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl">실행 취소</span>
    </button>
    <button class="btn" id="clear" title="전체 지우기">
      <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span class="lbl">전체 지우기</span>
    </button>
    <button class="btn" id="bg" title="캔버스 배경 밝기 전환">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" style="fill:currentColor"/></svg><span class="lbl">배경</span>
    </button>
    <button class="btn" id="save" title="투명 PNG 저장">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lbl">PNG</span>
    </button>
  </div>

  <div class="spacer"></div>
  <button class="btn primary" id="arBtn" title="AR로 보기">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg><span class="lbl">AR 보기</span>
  </button>
</header>

<main id="stage">
  <canvas id="draw"></canvas>
  <div class="empty" id="empty">여기에 낙서를 그려 보세요</div>
</main>
<div id="cursor"></div>

<div id="ar" aria-hidden="true">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="hands"></canvas>
  <div id="arUI">
    <div class="ar-top">
      <button class="chip icon" id="arClose" aria-label="드로잉으로 돌아가기">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="right">
        <span class="chip badge" id="arMode">Camera</span>
        <button class="chip icon" id="arFlip" aria-label="전면/후면 카메라 전환" hidden>
          <svg viewBox="0 0 24 24"><path d="M4 9a2 2 0 0 1 2-2h1.5L9 5h6l1.5 2H18a2 2 0 0 1 2 2v1"/><path d="M20 15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1"/><path d="m17 12 3-2 1 3"/><path d="m7 12-3 2-1-3"/></svg>
        </button>
      </div>
    </div>
    <div class="ar-bottom">
      <p class="hint" id="arHint"></p>
      <div class="ar-actions">
        <button class="chip" id="arHands" aria-pressed="true" hidden>
          <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg><span>손 인식</span>
        </button>
        <button class="chip" id="arBounce" aria-pressed="true" hidden>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21h16"/><path d="M12 11v4"/><path d="m9 18 3-3 3 3"/></svg><span>튕기기 켜짐</span>
        </button>
        <button class="chip" id="arXR" hidden>
          <svg viewBox="0 0 24 24"><path d="M3 17l9 4 9-4"/><path d="M3 12l9 4 9-4"/><path d="m3 7 9-4 9 4-9 4Z"/></svg>바닥 배치 AR
        </button>
        <button class="chip" id="arReset">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>초기화
        </button>
        <button class="chip" id="arShot">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.5"/><path d="M5 7h2.5L9 5h6l1.5 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/></svg>캡처
        </button>
        <a class="chip" id="qlLink" rel="ar" hidden><img alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
          <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Quick Look AR
        </a>
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let toastTimer;
function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// iOS Safari 핀치 확대 / 길게 누르기 메뉴 차단
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

/* =====================================================================
   1. DRAWING
   ===================================================================== */
const stage = $('#stage');
const cvs = $('#draw');
const ctx = cvs.getContext('2d', { willReadFrequently: true });
const cursorEl = $('#cursor');

const state = { tool: 'pen', size: 8, color: '#18181b' };
let dpr = 1;
let dirty = false;

const undoStack = [];
const UNDO_MAX = 15;

function resizeCanvas() {
  const r = stage.getBoundingClientRect();
  const nd = Math.min(window.devicePixelRatio || 1, 3);
  const nw = Math.max(1, Math.round(r.width * nd));
  const nh = Math.max(1, Math.round(r.height * nd));
  if (nw === cvs.width && nh === cvs.height) return;

  let snapshot = null;
  if (cvs.width > 1 && cvs.height > 1) {
    snapshot = document.createElement('canvas');
    snapshot.width = cvs.width; snapshot.height = cvs.height;
    snapshot.getContext('2d').drawImage(cvs, 0, 0);
  }
  cvs.width = nw; cvs.height = nh;
  cvs.style.width = r.width + 'px';
  cvs.style.height = r.height + 'px';
  dpr = nd;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (snapshot) ctx.drawImage(snapshot, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resizeCanvas).observe(stage);
resizeCanvas();

function pos(e) {
  const r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function setDirty(v) {
  dirty = v;
  $('#empty').classList.toggle('hide', v);
}

/* ---- Undo ---- */
function pushUndo() {
  undoStack.push(ctx.getImageData(0, 0, cvs.width, cvs.height));
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  $('#undo').disabled = false;
}
function undo() {
  const s = undoStack.pop();
  if (!s) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.restore();
  ctx.putImageData(s, 0, 0);
  $('#undo').disabled = undoStack.length === 0;
  setDirty(hasInk());
}
function clearAll() {
  if (!dirty) return;
  pushUndo();
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.restore();
  setDirty(false);
}
function hasInk() {
  const d = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
  for (let i = 3; i < d.length; i += 16) if (d[i] > 8) return true;
  return false;
}

/* ---- Stroke ---- */
let active = null;

function applyStyle() {
  ctx.globalCompositeOperation = state.tool === 'eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = ctx.fillStyle = state.color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function pressureWidth(e) {
  const mult = state.tool === 'eraser' ? 2 : 1;
  if (e.pointerType === 'pen' && e.pressure > 0) return state.size * mult * (0.2 + e.pressure * 1.0);
  return state.size * mult;
}
function segment(p, w) {
  const a = active;
  const mid = { x: (a.last.x + p.x) / 2, y: (a.last.y + p.y) / 2 };
  ctx.lineWidth = (a.w + w) / 2;
  ctx.beginPath();
  ctx.moveTo(a.lastMid.x, a.lastMid.y);
  ctx.quadraticCurveTo(a.last.x, a.last.y, mid.x, mid.y);
  ctx.stroke();
  a.last = p; a.lastMid = mid; a.w = w;
}

cvs.addEventListener('pointerdown', (e) => {
  if (active) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const p = pos(e);

  if (state.tool === 'fill') {
    pushUndo();
    const changed = floodFill(Math.floor(p.x * dpr), Math.floor(p.y * dpr), state.color);
    if (!changed) { undoStack.pop(); $('#undo').disabled = undoStack.length === 0; }
    else setDirty(true);
    return;
  }

  pushUndo();
  applyStyle();
  cvs.setPointerCapture(e.pointerId);
  const w = pressureWidth(e);
  active = { id: e.pointerId, last: p, lastMid: p, w };
  ctx.beginPath();
  ctx.arc(p.x, p.y, w / 2, 0, Math.PI * 2);
  ctx.fill();
  if (state.tool === 'pen') setDirty(true);
});

cvs.addEventListener('pointermove', (e) => {
  moveCursor(e);
  if (!active || e.pointerId !== active.id) return;
  const list = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (list.length ? list : [e])) segment(pos(ev), pressureWidth(ev));
});

function endStroke(e) {
  if (!active || e.pointerId !== active.id) return;
  const a = active;
  ctx.lineWidth = a.w;
  ctx.beginPath();
  ctx.moveTo(a.lastMid.x, a.lastMid.y);
  ctx.lineTo(a.last.x, a.last.y);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  active = null;
  if (state.tool === 'eraser') setDirty(hasInk());
}
cvs.addEventListener('pointerup', endStroke);
cvs.addEventListener('pointercancel', endStroke);
cvs.addEventListener('lostpointercapture', endStroke);

/* ---- Flood fill (scanline + 경계 안티앨리어싱 보정) ---- */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function floodFill(sx, sy, hex) {
  const w = cvs.width, h = cvs.height;
  if (sx < 0 || sy < 0 || sx >= w || sy >= h) return false;
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const s = (sy * w + sx) * 4;
  const tr = d[s], tg = d[s + 1], tb = d[s + 2], ta = d[s + 3];
  const [fr, fg, fb] = hexToRgb(hex);
  if (ta === 255 && Math.abs(tr - fr) + Math.abs(tg - fg) + Math.abs(tb - fb) < 6) return false;

  const TOL = 90;
  const clearTarget = ta < 16;
  const match = (i) => clearTarget
    ? d[i + 3] < 40
    : (Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) + Math.abs(d[i + 3] - ta)) <= TOL;

  const mask = new Uint8Array(w * h);
  const stack = [sy * w + sx];
  while (stack.length) {
    const p = stack.pop();
    if (mask[p] || !match(p * 4)) continue;
    const y = (p / w) | 0, row = y * w;
    let l = p - row, r = l;
    while (l > 0 && !mask[row + l - 1] && match((row + l - 1) * 4)) l--;
    while (r < w - 1 && !mask[row + r + 1] && match((row + r + 1) * 4)) r++;
    let up = false, dn = false;
    for (let x = l; x <= r; x++) {
      const q = row + x;
      mask[q] = 1;
      if (y > 0) {
        const u = q - w, ok = !mask[u] && match(u * 4);
        if (ok && !up) { stack.push(u); up = true; } else if (!ok) up = false;
      }
      if (y < h - 1) {
        const v = q + w, ok = !mask[v] && match(v * 4);
        if (ok && !dn) { stack.push(v); dn = true; } else if (!ok) dn = false;
      }
    }
  }

  // 2px 팽창: 선의 반투명 가장자리 아래까지 색을 깔아 틈(헤일로) 제거
  for (let pass = 0; pass < 2; pass++) {
    const src = mask.slice();
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        const p = row + x;
        if (src[p]) continue;
        if ((x > 0 && src[p - 1]) || (x < w - 1 && src[p + 1]) || (y > 0 && src[p - w]) || (y < h - 1 && src[p + w])) mask[p] = 2;
      }
    }
  }

  for (let p = 0, i = 0; p < mask.length; p++, i += 4) {
    const m = mask[p];
    if (!m) continue;
    if (m === 1) {
      d[i] = fr; d[i + 1] = fg; d[i + 2] = fb; d[i + 3] = 255;
    } else {
      const a = d[i + 3] / 255;
      d[i] = d[i] * a + fr * (1 - a);
      d[i + 1] = d[i + 1] * a + fg * (1 - a);
      d[i + 2] = d[i + 2] * a + fb * (1 - a);
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return true;
}

/* ---- Export: 그림 영역만 잘라 투명 PNG로 ---- */
function exportDrawing(maxSize = 1024) {
  const w = cvs.width, h = cvs.height;
  const d = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    const row = y * w * 4;
    for (let x = 0; x < w; x++) {
      if (d[row + x * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  const pad = Math.round(6 * dpr);
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const k = Math.min(1, maxSize / Math.max(cw, ch));
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(cw * k));
  out.height = Math.max(1, Math.round(ch * k));
  const o = out.getContext('2d');
  o.imageSmoothingQuality = 'high';
  o.drawImage(cvs, minX, minY, cw, ch, 0, 0, out.width, out.height);
  return { url: out.toDataURL('image/png'), w: out.width, h: out.height };
}

function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

window.addEventListener('keydown', (e) => {
  if ($('#ar').classList.contains('open')) { if (e.key === 'Escape') closeAR(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'b' || k === 'p') setTool('pen');
  else if (k === 'e') setTool('eraser');
  else if (k === 'g' || k === 'f') setTool('fill');
  else if (k === '[') setSize(state.size - 2);
  else if (k === ']') setSize(state.size + 2);
});

const clock = new THREE.Clock();

function initThree() {

/* ---- 드로잉 → 2.5D 메쉬 에셋 ---- */
let shadowTex = null;
function getShadowTexture() {
  if (shadowTex) return shadowTex;
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.38)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  shadowTex = new THREE.CanvasTexture(c);
  return shadowTex;
}

function disposeAsset() {
  if (!asset) return;
  asset.tex.dispose();
  [asset.geo, asset.hitGeo, asset.shadowGeo].forEach((g) => g.dispose());
  [asset.faceMat, asset.sideMat, asset.shadowMat, asset.hitMat].forEach((m) => m.dispose());
  asset = null;
}

async function buildAsset(ex) {
  disposeAsset();
  const tex = await new THREE.TextureLoader().loadAsync(ex.url);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.premultiplyAlpha = true;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const MAX = 0.35;
  let w, h;
  if (ex.w >= ex.h) { w = MAX; h = MAX * ex.h / ex.w; } else { h = MAX; w = MAX * ex.w / ex.h; }

  const geo = new THREE.PlaneGeometry(w, h);
  const faceMat = new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide, transparent: true, alphaTest: 0.01,
    blending: THREE.CustomBlending,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  });
  const sideMat = new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide, alphaTest: 0.5, color: new THREE.Color(0.42, 0.42, 0.45),
  });
  const hitGeo = new THREE.BoxGeometry(w, h, 0.05);
  const hitMat = new THREE.MeshBasicMaterial();
  const sr = Math.max(w * 1.15, 0.12);
  const shadowGeo = new THREE.PlaneGeometry(sr, sr * 0.45).rotateX(-Math.PI / 2);
  const shadowMat = new THREE.MeshBasicMaterial({ map: getShadowTexture(), transparent: true, depthWrite: false });

  asset = { tex, w, h, geo, faceMat, sideMat, hitGeo, hitMat, shadowGeo, shadowMat, url: ex.url };
}

// root(위치) → pivot(기울기·크기) → defA/defB(임의 축 방향 늘이기) → body(Y회전) → 레이어
function makeDoodle(centered = false) {
  const A = asset;
  const root = new THREE.Group();
  const pivot = new THREE.Group();
  const defA = new THREE.Group();
  const defB = new THREE.Group();
  const body = new THREE.Group();
  body.position.y = centered ? 0 : A.h / 2;
  defB.add(body); defA.add(defB); pivot.add(defA); root.add(pivot);

  const N = 8, D = 0.014;
  for (let i = 0; i < N; i++) {
    const face = i === 0 || i === N - 1;
    const m = new THREE.Mesh(A.geo, face ? A.faceMat : A.sideMat);
    m.position.z = -D * i / (N - 1);
    body.add(m);
  }
  const hit = new THREE.Mesh(A.hitGeo, A.hitMat);
  hit.visible = false;
  hit.position.z = -D / 2;
  hit.userData.root = root;
  body.add(hit);

  const shadow = new THREE.Mesh(A.shadowGeo, A.shadowMat);
  shadow.position.y = 0.002;
  root.add(shadow);

  root.userData = { pivot, defA, defB, body, shadow, hit, s: 1, b: -1, appear: 0, phase: Math.random() * Math.PI * 2 };
  return root;
}

function clearDoodles() {
  doodles.forEach((d) => scene.remove(d));
  doodles = [];
}

function bounce(o) {
  if (mode === 'camera') { poke(null); return; }
  o.userData.b = 0;
  if (navigator.vibrate) navigator.vibrate(12);
}

// WebXR 모드용 탭 애니메이션
function updateDoodle(o, dt, t) {
  const u = o.userData;
  let sq = 0, hop = 0, spin = 0;
  if (u.appear < 1) u.appear = Math.min(1, u.appear + dt / 0.55);
  if (u.b >= 0) {
    u.b += dt;
    const k = u.b;
    sq = Math.exp(-4.5 * k) * Math.sin(k * 20) * 0.22;
    hop = k < 0.42 ? Math.sin(Math.PI * k / 0.42) : 0;
    spin = easeOutCubic(Math.min(k / 0.8, 1));
    if (k > 1.8) u.b = -1;
  }
  const s = u.s * easeOutBack(u.appear);
  u.pivot.scale.set(s * (1 + sq), s * (1 - sq), s * (1 + sq));
  u.pivot.position.y = hop * 0.12 * u.s;
  u.body.rotation.y = spin * Math.PI * 2;
  u.body.rotation.z = Math.sin(t * 1.3 + u.phase) * 0.03;
  u.shadow.scale.setScalar(Math.max(0.001, s * (1 - hop * 0.35)));
}

function pickDoodle() {
  const hits = raycaster.intersectObjects(doodles.map((d) => d.userData.hit), false);
  return hits.length ? hits[0] : null;
}

/* =====================================================================
   3. PHYSICS (카메라 모드: 화면과 평행한 z=0 평면 위 2D 강체 + 탄성 변형)
   ===================================================================== */
const PH = {
  G: 4.2,          // 중력 (m/s²) — 실제보다 약간 낮춰 둥실한 느낌
  REST: 0.55,      // 바닥·벽 반발 계수
  HAND_REST: 0.6,  // 손과 부딪힐 때 반발 계수
  HIT_SPEED: 0.6,  // 이보다 느린 손은 '치기'가 아니라 살짝 미는 것으로 처리 (m/s)
  AIR: 0.35,       // 공기 저항
  UPRIGHT: 9,      // 오뚝이처럼 바로 서려는 힘
  ANG_DAMP: 1.6,
  K: 170, C: 17,   // 잡기 스프링 강성 / 감쇠
  DEF_K: 230, DEF_C: 9, // 젤리 변형 스프링
};
const HAND_R = Array.from({ length: 21 }, (_, i) => ([4, 8, 12, 16, 20].includes(i) ? 0.024 : i === 0 ? 0.03 : 0.02));
const bounds = { left: -0.5, right: 0.5, floor: 0, ceil: 0.8 };
const phys = {
  c: new THREE.Vector2(), v: new THREE.Vector2(), ang: 0, w: 0, yaw: 0, yawV: 0,
  def: { axis: 0, s: 1, sv: 0, target: 1 },
  grabs: new Map(), stretch: null, lastBuzz: 0,
};
let bounceEnabled = true;
const wrapA = (a) => Math.atan2(Math.sin(a), Math.cos(a));

function screenToPlane(x, y, out) {
  _ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  return raycaster.ray.intersectPlane(PLANE_Z0, out);
}

function updateBounds() {
  const W = window.innerWidth, H = window.innerHeight;
  if (screenToPlane(0, H / 2, tmpV)) bounds.left = tmpV.x;
  if (screenToPlane(W, H / 2, tmpV)) bounds.right = tmpV.x;
  if (screenToPlane(W / 2, Math.max(H * 0.6, H - 120), tmpV)) bounds.floor = tmpV.y; // 하단 버튼 위가 바닥
  if (screenToPlane(W / 2, 0, tmpV)) bounds.ceil = tmpV.y;
}

function halfExt() {
  const s = doodles[0] ? doodles[0].userData.s : 1;
  const cy = Math.max(Math.abs(Math.cos(phys.yaw)), 0.18); // Y로 돌리면 옆에서 본 만큼 얇아짐
  return { hx: (asset.w / 2) * s * cy, hy: (asset.h / 2) * s };
}

function resetPhys(drop = true) {
  const { hy } = halfExt();
  phys.c.set(0, drop ? Math.min(bounds.ceil - hy - 0.02, bounds.floor + hy + 0.4) : bounds.floor + hy);
  phys.v.set(0, 0);
  phys.ang = 0; phys.w = 0; phys.yaw = 0; phys.yawV = 0;
  Object.assign(phys.def, { axis: 0, s: 1, sv: 0, target: 1 });
  phys.grabs.clear();
  phys.stretch = null;
}

function rotV(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return new THREE.Vector2(v.x * c - v.y * s, v.x * s + v.y * c);
}
function toLocal(p) {
  return rotV(new THREE.Vector2(p.x - phys.c.x, p.y - phys.c.y), -phys.ang);
}
function isOnObject(p, margin) {
  if (!p || !asset) return false;
  const l = toLocal(p);
  const { hx, hy } = halfExt();
  return Math.abs(l.x) <= hx + margin && Math.abs(l.y) <= hy + margin;
}

function buzz(ms = 10) {
  const now = performance.now();
  if (now - phys.lastBuzz < 120) return;
  phys.lastBuzz = now;
  if (navigator.vibrate) navigator.vibrate(ms);
}

// 충돌 방향(worldAngle)으로 찌그러뜨렸다가 탄성으로 복원
function squash(worldAngle, amount) {
  const d = phys.def;
  if (phys.stretch) return;
  if (Math.abs(d.s - 1) < 0.15) d.axis = worldAngle - phys.ang;
  d.sv -= clamp(amount, 0, 4);
}

function poke(p) {
  const P = phys;
  const dx = p ? P.c.x - p.x : (Math.random() - 0.5) * 0.1;
  P.v.y = Math.max(P.v.y, 0) + 2.0;
  P.v.x += clamp(dx * 6, -1.2, 1.2);
  P.w += (p ? -dx : Math.random() - 0.5) * 14;
  squash(Math.PI / 2, 1.6);
  buzz(12);
}

function addGrab(id, p) {
  if (phys.grabs.size >= 2) return false;
  phys.grabs.set(id, { p: p.clone(), local: toLocal(p) });
  phys.yawV = 0;
  if (phys.grabs.size === 2) {
    const [a, b] = [...phys.grabs.values()];
    phys.stretch = {
      d0: Math.max(0.02, a.p.distanceTo(b.p)) / phys.def.s,
      a0: Math.atan2(b.p.y - a.p.y, b.p.x - a.p.x),
      ang0: phys.ang,
    };
  }
  return true;
}

function removeGrab(id) {
  if (!phys.grabs.delete(id)) return;
  if (phys.stretch) { phys.stretch = null; phys.def.target = 1; } // 놓으면 탄성으로 출렁이며 복원
  for (const g of phys.grabs.values()) g.local = toLocal(g.p);
}

function physStep(dt) {
  const P = phys, D = P.def;
  const { hx, hy } = halfExt();
  const grabs = [...P.grabs.values()];

  if (P.stretch && grabs.length >= 2) {
    // 양손(두 손가락)으로 잡고 늘리기
    const a = grabs[0].p, b = grabs[1].p;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    P.v.x += ((mx - P.c.x) * PH.K - P.v.x * PH.C) * dt;
    P.v.y += ((my - P.c.y) * PH.K - P.v.y * PH.C) * dt;
    const angW = Math.atan2(b.y - a.y, b.x - a.x);
    const target = P.stretch.ang0 + wrapA(angW - P.stretch.a0);
    const prev = P.ang;
    P.ang += wrapA(target - P.ang) * Math.min(1, dt * 18);
    P.w = (P.ang - prev) / dt;
    const ns = clamp(a.distanceTo(b) / P.stretch.d0, 0.4, 4);
    D.sv = (ns - D.s) / dt;
    D.s = ns;
    D.axis = angW - P.ang;
    P.c.x += P.v.x * dt; P.c.y += P.v.y * dt;
  } else {
    P.v.y -= PH.G * dt;
    D.target = 1;
    if (grabs.length === 1) {
      // 한 점을 잡고 매달린 상태: 스프링 + 진자 회전 + 속도 방향 젤리 늘어짐
      const g = grabs[0];
      const r = rotV(g.local, P.ang);
      const fx = (g.p.x - (P.c.x + r.x)) * PH.K - P.v.x * PH.C;
      const fy = (g.p.y - (P.c.y + r.y)) * PH.K - P.v.y * PH.C;
      P.v.x += fx * dt; P.v.y += fy * dt;
      const I = (hx * hx + hy * hy) / 3;
      P.w += ((r.x * fy - r.y * fx) / I * 0.35 - P.w * 3) * dt;
      const sp = P.v.length();
      if (sp > 0.08) {
        if (Math.abs(D.s - 1) < 0.25) D.axis = Math.atan2(P.v.y, P.v.x) - P.ang;
        D.target = 1 + Math.min(sp * 0.14, 0.5);
      }
    } else {
      P.w += (-wrapA(P.ang) * PH.UPRIGHT - P.w * PH.ANG_DAMP) * dt;
    }
    P.v.multiplyScalar(Math.exp(-PH.AIR * dt));
    P.c.x += P.v.x * dt; P.c.y += P.v.y * dt;
    P.w = clamp(P.w, -25, 25);
    P.ang += P.w * dt;
    const acc = -PH.DEF_K * (D.s - D.target) - PH.DEF_C * D.sv;
    D.sv += acc * dt;
    D.s = clamp(D.s + D.sv * dt, 0.4, 4);
  }
  collideBounds(hx, hy, dt);
}

function collideBounds(hx, hy, dt) {
  const P = phys;
  const ca = Math.abs(Math.cos(P.ang)), sa = Math.abs(Math.sin(P.ang));
  const ex = ca * hx + sa * hy, ey = sa * hx + ca * hy;

  if (P.c.y - ey < bounds.floor) {
    P.c.y = bounds.floor + ey;
    if (P.v.y < 0) {
      const imp = -P.v.y;
      P.v.y = imp > 0.25 ? imp * PH.REST : 0;
      if (imp > 0.5) {
        squash(Math.PI / 2, imp * 0.9); buzz(8);
        P.w += -P.v.x * 1.5;                     // 비스듬히 떨어지면 구르듯 회전
      }
    }
    P.v.x *= Math.exp(-3 * dt);                  // 바닥 마찰
    P.w *= Math.exp(-2 * dt);
  }
  if (P.c.y + ey > bounds.ceil) {
    P.c.y = bounds.ceil - ey;
    if (P.v.y > 0) { const imp = P.v.y; P.v.y = -imp * PH.REST; if (imp > 0.5) squash(Math.PI / 2, imp * 0.7); }
  }
  if (P.c.x - ex < bounds.left) {
    P.c.x = bounds.left + ex;
    if (P.v.x < 0) { const imp = -P.v.x; P.v.x = imp * PH.REST; if (imp > 0.5) squash(0, imp * 0.8); }
  }
  if (P.c.x + ex > bounds.right) {
    P.c.x = bounds.right - ex;
    if (P.v.x > 0) { const imp = P.v.x; P.v.x = -imp * PH.REST; if (imp > 0.5) squash(0, imp * 0.8); }
  }
}

// 손 관절 21개를 작은 원 콜라이더로 보고 오브젝트(회전된 상자)와 충돌 처리
function handCollide() {
  if (!bounceEnabled || phys.stretch || phys.grabs.size || !asset) return; // 잡고 있는 동안엔 다른 손에 튕기지 않음
  const { hx, hy } = halfExt();
  const I = (hx * hx + hy * hy) / 3;
  const now = performance.now();
  for (const st of handState.values()) {
    st.touch = false;
    if (!st.world || st.grab || st.ready || now < st.noCollideUntil) continue; // 집으려는 손은 통과
    for (let i = 0; i < 21; i++) {
      if (contact(st.world[i], st.vel[i], HAND_R[i], hx, hy, I)) st.touch = true;
    }
  }
}

function contact(p, vp, R, hx, hy, I) {
  const P = phys;
  const l = toLocal(p);
  const qx = clamp(l.x, -hx, hx), qy = clamp(l.y, -hy, hy);
  let nx = l.x - qx, ny = l.y - qy;
  const dist = Math.hypot(nx, ny);
  let pen;
  if (dist > R) return false;
  if (dist > 1e-6) { nx /= dist; ny /= dist; pen = R - dist; }
  else {
    const px = hx - Math.abs(l.x), py = hy - Math.abs(l.y);
    if (px < py) { nx = Math.sign(l.x) || 1; ny = 0; pen = px + R; }
    else { nx = 0; ny = Math.sign(l.y) || 1; pen = py + R; }
  }
  const soft = vp.length() < PH.HIT_SPEED;            // 느린 손: 튕기지 않고 살짝 밀기
  if (soft) pen *= 0.35;
  const c = Math.cos(P.ang), s = Math.sin(P.ang);
  const wx = nx * c - ny * s, wy = nx * s + ny * c;   // 오브젝트 → 손 방향 법선
  P.c.x -= wx * pen; P.c.y -= wy * pen;               // 겹친 만큼 밀어내기

  const rvx = P.v.x - vp.x, rvy = P.v.y - vp.y;
  const vn = rvx * wx + rvy * wy;                     // 손 쪽으로 다가가는 상대 속도
  if (vn > 0) {
    const j = soft ? vn * 0.5 : (1 + PH.HAND_REST) * vn;
    P.v.x -= j * wx; P.v.y -= j * wy;
    const rx = qx * c - qy * s, ry = qx * s + qy * c; // 접촉점(중심 기준)
    P.w += (rx * (-j * wy) - ry * (-j * wx)) / I * 0.6;
    // 손이 미끄러지듯 스치면 그 방향으로 끌려가며 회전
    const tx = -wy, ty = wx;
    const vt = (vp.x - P.v.x) * tx + (vp.y - P.v.y) * ty;
    P.v.x += tx * vt * 0.25; P.v.y += ty * vt * 0.25;
    P.w += (rx * ty - ry * tx) * vt * 0.25 / I;
    if (!soft && j > 0.4) squash(Math.atan2(wy, wx), j * 0.5);
    if (!soft && j > 0.8) buzz(10);
  }
  return true;
}

function applyPhys(o, dt) {
  const P = phys, u = o.userData;
  if (u.appear < 1) u.appear = Math.min(1, u.appear + dt / 0.55);
  const s = u.s * easeOutBack(u.appear);
  o.position.set(P.c.x, P.c.y, 0);
  o.rotation.set(0, 0, 0);
  u.pivot.position.set(0, 0, 0);
  u.pivot.rotation.set(0, 0, P.ang);
  u.pivot.scale.setScalar(Math.max(0.001, s));
  u.defA.rotation.z = P.def.axis;
  u.defA.scale.set(P.def.s, 1 / Math.sqrt(P.def.s), 1);
  u.defB.rotation.z = -P.def.axis;
  u.body.rotation.set(0, P.yaw, 0);
  const { hy } = halfExt();
  const lift = Math.max(0, P.c.y - hy - bounds.floor);
  u.shadow.position.set(0, bounds.floor - P.c.y + 0.002, 0);
  u.shadow.scale.setScalar(Math.max(0.001, s * Math.max(0.25, 1 - lift * 1.4)));
}

/* ---- Render loop ---- */
function loop(time, frame) {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (frame && mode === 'xr') xrUpdate(frame);
  if (mode === 'camera' && doodles[0]) {
    updateBounds();
    if (handEnabled && handLandmarker && stream) processHands();
    if (dt > 0) {
      applyInertia(dt);
      handCollide();
      const n = 3;
      for (let i = 0; i < n; i++) physStep(dt / n);
    }
    applyPhys(doodles[0], dt);
  } else {
    for (const o of doodles) updateDoodle(o, dt, t);
  }
  renderer.render(scene, camera);
}

/* ---- Open / close ---- */
async function openAR() {
  const ex = exportDrawing();
  if (!ex) { toast('먼저 낙서를 그려 주세요'); return; }
  initThree();
  const btn = $('#arBtn');
  btn.disabled = true;
  try {
    await buildAsset(ex);
    // 손 인식·물리는 카메라 영상이 필요하므로 카메라 모드가 기본.
    // WebXR(바닥 배치)은 AR 화면의 '바닥 배치 AR' 버튼으로 전환.
    await startCameraMode();
  } finally {
    btn.disabled = false;
  }
}

function closeAR() {
  const session = renderer && renderer.xr.getSession();
  if (session) { session.end(); return; }
  teardown();
}

function teardown() {
  if (renderer) renderer.setAnimationLoop(null);
  if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
  video.srcObject = null;
  clearDoodles();
  clearHands();
  phys.grabs.clear(); phys.stretch = null;
  ptrs.clear(); gesture = null;
  if (reticle) reticle.visible = false;
  hitSource = transientSource = xrDrag = null;
  mode = null;
  arEl.className = '';
  arEl.setAttribute('aria-hidden', 'true');
  const ql = $('#qlLink');
  if (ql.href && ql.href.startsWith('blob:')) URL.revokeObjectURL(ql.href);
  ql.removeAttribute('href');
  ql.hidden = true;
}

$('#arBtn').addEventListener('click', openAR);
$('#arClose').addEventListener('click', closeAR);
$('#arReset').addEventListener('click', () => {
  if (mode === 'camera' && doodles[0]) {
    doodles[0].userData.s = 1;
    resetPhys(true);
  } else if (mode === 'xr') {
    clearDoodles();
    setHint(floorFound ? '바닥을 탭하여 낙서를 배치하세요' : '바닥을 천천히 비춰 주세요');
  }
});
$('#arShot').addEventListener('click', capture);
$('#arFlip').addEventListener('click', async () => {
  if (mode !== 'camera') return;
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startStream(); }
  catch (err) { console.warn(err); toast('다른 카메라를 사용할 수 없습니다'); facing = facing === 'environment' ? 'user' : 'environment'; }
});
$('#arHands').addEventListener('click', () => {
  if (mode === 'xr') {
    switchToHands = true;
    const s = renderer.xr.getSession();
    if (s) s.end();
    return;
  }
  setHandEnabled(!handEnabled);
});
$('#arBounce').addEventListener('click', () => {
  bounceEnabled = !bounceEnabled;
  const b = $('#arBounce');
  b.setAttribute('aria-pressed', String(bounceEnabled));
  b.querySelector('span').textContent = bounceEnabled ? '튕기기 켜짐' : '튕기기 꺼짐';
  toast(bounceEnabled ? '손으로 쳐서 튕길 수 있습니다' : '튕기기를 껐습니다 — 잡고 늘리기에 집중');
});
$('#arXR').addEventListener('click', async () => {
  if (mode !== 'camera') return;
  stopCamera();
  try { await startXR(); }
  catch (err) {
    console.warn(err);
    toast('WebXR을 시작할 수 없습니다');
    await startCameraMode();
  }
});
$$('.ar-top, .ar-actions').forEach((el) => el.addEventListener('beforexrselect', (e) => e.preventDefault()));

/* ---- iOS: Quick Look(USDZ) ---- */
async function prepareQuickLook() {
  const link = $('#qlLink');
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = asset.url; });
    const tex = new THREE.Texture(img);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    const mat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 1, metalness: 0 });
    const g = new THREE.Group();
    const m = new THREE.Mesh(asset.geo, mat);
    m.position.y = asset.h / 2;
    g.add(m);
    const buf = await new USDZExporter().parseAsync(g);
    if (mode !== 'camera') return;
    link.href = URL.createObjectURL(new Blob([buf], { type: 'model/vnd.usdz+zip' }));
    link.hidden = false;
    mat.dispose(); tex.dispose();
  } catch (err) {
    console.warn('USDZ export failed', err);
  }
}

/* ---- Camera overlay mode ---- */
async function startCameraMode() {
  mode = 'camera';
  arEl.className = 'open';
  arEl.setAttribute('aria-hidden', 'false');
  $('#arMode').textContent = 'Camera';
  $('#arShot').hidden = false;
  $('#arXR').hidden = !xrSupported;
  grid.visible = false;

  camera.fov = 50;
  camera.position.set(0, 0.32, 1.0);
  camera.lookAt(0, 0.32, 0);
  onResize();
  camera.updateMatrixWorld();

  try {
    await startStream();
  } catch (err) {
    console.warn(err);
    arEl.classList.add('nocam');
    grid.visible = true;
    toast('카메라를 사용할 수 없어 3D 미리보기로 표시합니다');
  }
  if (mode !== 'camera') return;
  $('#arFlip').hidden = !stream;
  $('#arHands').hidden = !stream;
  $('#arBounce').hidden = !stream;

  clearDoodles();
  const o = makeDoodle(true);
  scene.add(o);
  doodles.push(o);
  updateBounds();
  grid.position.y = bounds.floor;
  resetPhys(true);
  clock.getDelta();
  renderer.setAnimationLoop(loop);

  if (stream && handEnabled) setHandEnabled(true);
  else updateHandUI();

  if (isIOS) prepareQuickLook();
}

async function startStream() {
  const next = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  if (stream) stream.getTracks().forEach((tr) => tr.stop());
  stream = next;
  video.srcObject = stream;
  await video.play();
  const fm = stream.getVideoTracks()[0].getSettings().facingMode;
  mirrored = fm !== 'environment';
  arEl.classList.toggle('mirror', mirrored);
  lastVideoTime = -1;
  clearHands();
}

function stopCamera() {
  renderer.setAnimationLoop(null);
  if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
  video.srcObject = null;
  clearDoodles();
  clearHands();
  phys.grabs.clear(); phys.stretch = null;
  ptrs.clear(); gesture = null;
}

/* ---- 마우스·터치 (손 인식과 같은 물리 사용) ---- */
const ptrs = new Map();
let gesture = null, lastRotT = 0;

function ptrWorld(e) {
  const v = screenToPlane(e.clientX, e.clientY, new THREE.Vector3());
  return v ? new THREE.Vector2(v.x, v.y) : null;
}
function pairDist() {
  const [a, b] = [...ptrs.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function onCamDown(e) {
  if (mode !== 'camera' || !doodles[0]) return;
  e.preventDefault();
  renderer.domElement.setPointerCapture(e.pointerId);
  const rec = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, lx: e.clientX, t: performance.now(), moved: false, grab: false };
  ptrs.set(e.pointerId, rec);
  const pw = ptrWorld(e);
  const margin = phys.grabs.size > 0 ? 0.25 : 0.02;
  if (pw && phys.grabs.size < 2 && isOnObject(pw, margin) && addGrab('p' + e.pointerId, pw)) {
    rec.grab = true;
    gesture = null;
    return;
  }
  if (ptrs.size === 1) { gesture = { type: 'rotate' }; phys.yawV = 0; }
  else if (ptrs.size === 2 && phys.grabs.size === 0) {
    gesture = { type: 'scale', d0: Math.max(1, pairDist()), s0: doodles[0].userData.s };
  }
}

function onCamMove(e) {
  const rec = ptrs.get(e.pointerId);
  if (!rec) return;
  rec.x = e.clientX; rec.y = e.clientY;
  if (Math.hypot(rec.x - rec.sx, rec.y - rec.sy) > 6) rec.moved = true;
  if (rec.grab) {
    const g = phys.grabs.get('p' + e.pointerId);
    const pw = ptrWorld(e);
    if (g && pw) g.p.copy(pw);
    return;
  }
  if (!gesture) return;
  if (gesture.type === 'scale' && ptrs.size >= 2) {
    doodles[0].userData.s = clamp(gesture.s0 * pairDist() / gesture.d0, 0.3, 3);
  } else if (gesture.type === 'rotate' && rec.moved) {
    const dx = e.clientX - rec.lx;
    phys.yaw += dx * 0.012;
    phys.yawV = dx * 0.012;
    lastRotT = performance.now();
    rec.lx = e.clientX;
  }
}

function onCamUp(e) {
  const rec = ptrs.get(e.pointerId);
  if (!rec) return;
  ptrs.delete(e.pointerId);
  if (rec.grab) {
    removeGrab('p' + e.pointerId);
    if (!rec.moved && performance.now() - rec.t < 300) poke(ptrWorld(e));
  }
  if (gesture && gesture.type === 'rotate' && performance.now() - lastRotT > 80) phys.yawV = 0;
  if (ptrs.size === 0 || (gesture && gesture.type === 'scale')) gesture = null;
}

function onCamWheel(e) {
  if (mode !== 'camera' || !doodles[0]) return;
  e.preventDefault();
  const u = doodles[0].userData;
  u.s = clamp(u.s * Math.exp(-e.deltaY * 0.0015), 0.3, 3);
}

function applyInertia(dt) {
  if (gesture && gesture.type === 'rotate') return;
  if (Math.abs(phys.yawV) < 0.0002) { phys.yawV = 0; return; }
  phys.yaw += phys.yawV;
  phys.yawV *= Math.pow(0.92, dt * 60);
}

function capture() {
  if (mode !== 'camera') return;
  const W = renderer.domElement.width, H = renderer.domElement.height;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  if (stream && video.videoWidth) {
    const vr = video.videoWidth / video.videoHeight, cr = W / H;
    let sw, sh, sx, sy;
    if (vr > cr) { sh = video.videoHeight; sw = sh * cr; sx = (video.videoWidth - sw) / 2; sy = 0; }
    else { sw = video.videoWidth; sh = sw / cr; sx = 0; sy = (video.videoHeight - sh) / 2; }
    x.save();
    if (mirrored) { x.translate(W, 0); x.scale(-1, 1); }
    x.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
    x.restore();
  } else {
    x.fillStyle = '#111113';
    x.fillRect(0, 0, W, H);
  }
  renderer.render(scene, camera);
  x.drawImage(renderer.domElement, 0, 0);
  download(c.toDataURL('image/png'), 'doodle-ar.png');
  toast('캡처 이미지를 저장했습니다');
}

/* =====================================================================
   4. HAND TRACKING (MediaPipe Hand Landmarker)
   ===================================================================== */
const MP_VER = '0.10.14';
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];

const handsCvs = $('#hands');
const hctx = handsCvs.getContext('2d');
let handLandmarker = null, handLoading = null, handEnabled = true, lastVideoTime = -1;
const handState = new Map();

function loadHands() {
  if (handLandmarker) return Promise.resolve(handLandmarker);
  if (!handLoading) {
    handLoading = (async () => {
      const { FilesetResolver, HandLandmarker } = await import(`${MP_BASE}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
      const opts = (delegate) => ({
        baseOptions: { modelAssetPath: HAND_MODEL, delegate },
        runningMode: 'VIDEO', numHands: 2,
        minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.6, minTrackingConfidence: 0.5,
      });
      try { handLandmarker = await HandLandmarker.createFromOptions(files, opts('GPU')); }
      catch { handLandmarker = await HandLandmarker.createFromOptions(files, opts('CPU')); }
      return handLandmarker;
    })().catch((err) => { handLoading = null; throw err; });
  }
  return handLoading;
}

function updateHandUI(label) {
  const btn = $('#arHands');
  const span = btn.querySelector('span');
  if (mode === 'xr') {
    btn.setAttribute('aria-pressed', 'false');
    span.textContent = '손 인식 모드';
    return;
  }
  btn.setAttribute('aria-pressed', String(handEnabled));
  span.textContent = label || (handEnabled ? '손 인식 켜짐' : '손 인식 꺼짐');
  setHint(handEnabled && handLandmarker ? HAND_HINT : TOUCH_HINT);
}

async function setHandEnabled(on) {
  handEnabled = on;
  if (!on) { clearHands(); updateHandUI(); return; }
  if (!handLandmarker) {
    updateHandUI('손 인식 준비 중…');
    toast('손 인식 모델을 불러오는 중입니다');
    try { await loadHands(); toast('카메라에 손을 비춰 보세요'); }
    catch (err) {
      console.warn(err);
      handEnabled = false;
      toast('손 인식 모델을 불러오지 못했습니다');
    }
  }
  if (mode === 'camera') updateHandUI();
}

function clearHands() {
  hctx.setTransform(1, 0, 0, 1, 0, 0);
  hctx.clearRect(0, 0, handsCvs.width, handsCvs.height);
  for (const st of handState.values()) if (st.grab) removeGrab(st.grab);
  handState.clear();
}

const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function processHands() {
  if (video.readyState < 2 || !video.videoWidth) return;
  const W = window.innerWidth, H = window.innerHeight;
  const hd = Math.min(window.devicePixelRatio || 1, 2);
  if (handsCvs.width !== Math.round(W * hd) || handsCvs.height !== Math.round(H * hd)) {
    handsCvs.width = Math.round(W * hd);
    handsCvs.height = Math.round(H * hd);
  }
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  let res;
  try { res = handLandmarker.detectForVideo(video, performance.now()); }
  catch (err) { console.warn(err); return; }

  // 영상(object-fit: cover) 좌표 → 화면 좌표
  const vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  const dw = vw * sc, dh = vh * sc, ox = (W - dw) / 2, oy = (H - dh) / 2;
  const toScreen = (l) => {
    let x = ox + l.x * dw;
    if (mirrored) x = W - x;
    return { x, y: oy + l.y * dh };
  };

  hctx.setTransform(hd, 0, 0, hd, 0, 0);
  hctx.clearRect(0, 0, W, H);

  const now = performance.now();
  const seen = new Set();
  (res.landmarks || []).forEach((lm, i) => {
    let key = (res.handedness && res.handedness[i] && res.handedness[i][0] && res.handedness[i][0].categoryName) || 'hand';
    if (seen.has(key)) key += i;
    seen.add(key);
    let st = handState.get(key);
    if (!st) {
      st = { key, pinch: false, ready: false, openFrames: 0, grab: null, noCollideUntil: 0, t: now, world: null, vel: null, touch: false };
      handState.set(key, st);
    }
    const pts = lm.map(toScreen);
    updateHand(st, pts, now);
    drawHand(pts, st);
  });
  for (const [k, st] of handState) {
    if (!seen.has(k) && now - st.t > 250) { if (st.grab) removeGrab(st.grab); handState.delete(k); }
  }
}

function updateHand(st, pts, now) {
  const dt = Math.max(0.008, (now - st.t) / 1000);
  const stale = now - st.t > 250;
  st.t = now;

  // 화면 좌표 → 물리 평면(월드) 좌표, 관절별 속도
  const world = pts.map((p) => {
    const v = screenToPlane(p.x, p.y, tmpV);
    return v ? new THREE.Vector2(v.x, v.y) : new THREE.Vector2(9, 9);
  });
  if (st.world && !stale) {
    st.vel = world.map((w, i) => {
      const raw = new THREE.Vector2((w.x - st.world[i].x) / dt, (w.y - st.world[i].y) / dt);
      if (raw.length() > 6) raw.setLength(6);
      return st.vel ? st.vel[i].lerp(raw, 0.6) : raw;
    });
  } else {
    st.vel = world.map(() => new THREE.Vector2());
  }
  st.world = world;

  // 집기 판정 (손 크기로 정규화 + 히스테리시스)
  const size = dist2(pts[0], pts[9]) || 1;
  const ratio = dist2(pts[4], pts[8]) / size;
  const was = st.pinch;
  if (!was) { st.pinch = ratio < 0.3; st.openFrames = 0; }
  else if (ratio >= 0.45) { st.openFrames = (st.openFrames || 0) + 1; st.pinch = st.openFrames < 3; } // 2프레임 떨림은 무시
  else st.openFrames = 0;
  // 검지를 편 채 엄지와 가까워지는 중 = 집으려는 손 → 충돌 끔 (주먹은 계속 충돌)
  st.ready = st.pinch || (ratio < 0.65 && dist2(pts[8], pts[0]) / size > 1.3);
  st.tip = pts[8];
  st.ppS = { x: (pts[4].x + pts[8].x) / 2, y: (pts[4].y + pts[8].y) / 2 };
  const ppW = new THREE.Vector2((world[4].x + world[8].x) / 2, (world[4].y + world[8].y) / 2);

  if (st.pinch && !was && doodles[0]) {
    const margin = phys.grabs.size > 0 ? 0.22 : 0.08;
    if (phys.grabs.size < 2 && isOnObject(ppW, margin)) {
      const id = 'h-' + st.key;
      if (addGrab(id, ppW)) { st.grab = id; buzz(8); }
    }
  }
  if (!st.pinch && was && st.grab) {
    removeGrab(st.grab);
    st.grab = null;
    st.noCollideUntil = now + 400; // 놓는 순간 손가락에 다시 튕기지 않게
  }
  if (st.grab) {
    const g = phys.grabs.get(st.grab);
    if (g) g.p.lerp(ppW, 0.7); else st.grab = null;
  }
}

function drawHand(pts, st) {
  hctx.lineWidth = 1.5;
  hctx.strokeStyle = st.touch ? 'rgba(250,250,250,0.9)' : 'rgba(250,250,250,0.5)';
  hctx.beginPath();
  for (const [a, b] of HAND_LINKS) { hctx.moveTo(pts[a].x, pts[a].y); hctx.lineTo(pts[b].x, pts[b].y); }
  hctx.stroke();
  hctx.fillStyle = 'rgba(250,250,250,0.8)';
  for (const p of pts) { hctx.beginPath(); hctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); hctx.fill(); }

  if (st.pinch) {
    hctx.fillStyle = st.grab ? 'rgba(250,250,250,0.95)' : 'rgba(250,250,250,0.45)';
    hctx.beginPath(); hctx.arc(st.ppS.x, st.ppS.y, st.grab ? 12 : 9, 0, Math.PI * 2); hctx.fill();
  } else {
    hctx.lineWidth = st.touch ? 3 : 1.5;
    hctx.strokeStyle = st.touch ? 'rgba(250,250,250,1)' : 'rgba(250,250,250,0.7)';
    hctx.beginPath(); hctx.arc(st.tip.x, st.tip.y, st.touch ? 16 : 12, 0, Math.PI * 2); hctx.stroke();
  }
}

/* =====================================================================
   5. WebXR immersive-ar (Android Chrome — 바닥 배치)
   ===================================================================== */
async function startXR() {
  arEl.className = 'open xr';
  arEl.setAttribute('aria-hidden', 'false');
  $('#arMode').textContent = 'WebXR';
  $('#arShot').hidden = true;
  $('#arFlip').hidden = true;
  $('#arXR').hidden = true;
  $('#qlLink').hidden = true;
  $('#arHands').hidden = false;
  $('#arBounce').hidden = true;
  grid.visible = false;

  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: arEl },
  });
  mode = 'xr';
  floorFound = false;
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  xrRefSpace = renderer.xr.getReferenceSpace();

  const viewer = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({ space: viewer });
  if (session.requestHitTestSourceForTransientInput) {
    session.requestHitTestSourceForTransientInput({ profile: 'generic-touchscreen' })
      .then((s) => { transientSource = s; }).catch(() => {});
  }
  session.addEventListener('end', () => {
    if (hitSource) { try { hitSource.cancel(); } catch {} }
    teardown();
    if (switchToHands) { switchToHands = false; startCameraMode(); }
  });

  updateHandUI();
  clearDoodles();
  setHint('바닥을 천천히 비춰 주세요');
  clock.getDelta();
  renderer.setAnimationLoop(loop);
}

function xrUpdate(frame) {
  if (hitSource) {
    const results = frame.getHitTestResults(hitSource);
    if (results.length) {
      const pose = results[0].getPose(xrRefSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      if (!floorFound) {
        floorFound = true;
        if (!doodles.length) setHint('바닥을 탭하여 낙서를 배치하세요');
      }
    } else {
      reticle.visible = false;
    }
  }

  if (xrDrag && transientSource) {
    for (const r of frame.getHitTestResultsForTransientInput(transientSource)) {
      if (!r.results.length) continue;
      const p = r.results[0].getPose(xrRefSpace).transform.position;
      const o = xrDrag.obj;
      if (!xrDrag.off) xrDrag.off = new THREE.Vector3(o.position.x - p.x, 0, o.position.z - p.z);
      o.position.set(p.x + xrDrag.off.x, p.y, p.z + xrDrag.off.z);
      break;
    }
  }
}

function faceCamera(o) {
  const cam = renderer.xr.getCamera();
  const cp = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
  o.rotation.y = Math.atan2(cp.x - o.position.x, cp.z - o.position.z);
}

function onXRSelectStart() {
  if (mode !== 'xr' || !asset) return;
  raycaster.setFromXRController(controller);
  const hit = pickDoodle();
  if (hit) {
    const o = hit.object.userData.root;
    bounce(o);
    xrDrag = { obj: o, off: null };
    return;
  }
  if (!reticle.visible) return;
  if (doodles.length >= 12) scene.remove(doodles.shift());
  const o = makeDoodle(false);
  o.position.setFromMatrixPosition(reticle.matrix);
  faceCamera(o);
  scene.add(o);
  doodles.push(o);
  setHint('낙서 탭: 튀어오르기 · 누른 채 끌기: 이동 · 빈 바닥 탭: 하나 더 배치');
}
</script>
